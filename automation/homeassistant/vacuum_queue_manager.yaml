blueprint:
  name: Dreame Vacuum - Updating the to clean list
  description: >
    Updates the cleaning queue when the robot starts or changes rooms.

    ### Search Regex List:
    - **Queue Text Helper:** `^input_text\..*_rooms_to_clean$`
    - **Currently Cleaning Helper:** `^input_number\..*_currently_cleaned$`

    ### Data Format Requirements:
    - **Queue Format:** Must be a comma-separated list, optionally wrapped in brackets. 
      *Example:* `[1, 5, 12]` or `1,5,12`
    - **Helper Association:** Both helpers must be assigned to the same **Device** as the vacuum robot in Home Assistant.
  domain: automation
  input:
    vacuum_entity:
      name: Vacuum Robot
      description: "The Dreame vacuum robot entity. This device must also be assigned the helper entities (queue, current segment, etc.) for dynamic discovery to work."
      selector:
        entity:
          domain: vacuum
          integration: dreame_vacuum
    corridor_rooms:
      name: Corridor Rooms
      description: "Comma-separated list of room IDs that the vacuum passes through but shouldn't affect the queue (e.g., 1,5 or [1, 5])."
      default: ""
      selector:
        text:
    notification_script:
      name: Notification Script
      description: "Optional script to call when a room is skipped or the cleaning cycle ends prematurely. The script will be called with a 'message' variable."
      default: ""
      selector:
        entity:
          domain: script

mode: single

variables:
  # Identify device and entities associated with the vacuum
  vacuum_ent: !input vacuum_entity
  dev_id: "{{ device_id(vacuum_ent) }}"
  # Find all entities belonging to the same device OR sharing any label with the vacuum entity.
  # This dynamic discovery reduces the number of blueprint inputs/variables the user must configure.
  dev_entities: >-
    {% set all_labels = (labels(vacuum_ent)) | unique %}
    {% set labeled_entities = all_labels | map('label_entities') | sum(start=[]) %}
    {{ (device_entities(dev_id) + labeled_entities) | unique | list }}

  # Discover helper entities dynamically using naming pattern matches
  queue_text_helper: "{{ dev_entities | select('match', '^input_text\\..*_rooms_to_clean$') | first | default('none') }}"
  currently_cleaned_helper: "{{ dev_entities | select('match', '^input_number\\..*_currently_cleaned$') | first | default('none') }}"
  corridor_rooms_input: !input corridor_rooms
  state_sensor: "{{ dev_entities | select('match', '^sensor\\..*_state$') | first | default('none') }}"

# 1. TRIGGER: Specifically watching for undocking, segment transitions, and returns
trigger:
  - trigger: state
    entity_id: !input vacuum_entity
    from: docked
    to: cleaning
  - trigger: state
    entity_id: !input vacuum_entity
    attribute: current_segment
  - trigger: state
    entity_id: !input vacuum_entity
    to: docked
  - trigger: state
    entity_id: !input vacuum_entity
    to: returning
  - trigger: state
    entity_id: !input vacuum_entity
    to: idle

condition:
  - condition: template
    value_template: >-
      {% set status_state = states(state_sensor) if state_sensor != 'none' else 'unknown' %}
      {{ status_state not in ['washing', 'returning_to_wash', 'drying'] }}

action:
  # Notify if required helper entities are missing
  - if:
      - condition: template
        value_template: "{{ queue_text_helper == 'none' or currently_cleaned_helper == 'none' }}"
    then:
      - action: persistent_notification.create
        data:
          title: "Vacuum Queue Manager Error"
          message: "Helpers not found for device {{ dev_id }}. Text: {{ queue_text_helper }}, Number: {{ currently_cleaned_helper }}."
      - stop: "Required helpers missing"

  - variables:
      # Parse current room queue from the helper text state
      current_queue: >-
        {% set val = states(queue_text_helper) %}
        {% if val not in ['unknown', 'unavailable', ''] %}
          {% set raw = val | replace('[', '') | replace(']', '') | replace(' ', '') %}
          {{ raw.split(',') | map('int', 0) | select('gt', 0) | list }}
        {% else %}
          []
        {% endif %}
      parsed_corridor_rooms: >-
        {% set val = corridor_rooms_input %}
        {% if val not in ['unknown', 'unavailable', ''] %}
          {% set raw = val | replace('[', '') | replace(']', '') | replace(' ', '') %}
          {{ raw.split(',') | map('int', 0) | select('gt', 0) | list }}
        {% else %}
          []
        {% endif %}
      # Get the segment currently being cleaned from the vacuum attributes
      active_segment: "{{ state_attr(vacuum_ent, 'current_segment') | int(0) }}"

  # Handle premature end of the cleaning cycle (clear queue and notify)
  - if:
      - condition: template
        value_template: >
          {{
            states(vacuum_ent) in ['returning', 'docked', 'idle'] and
            not state_attr(vacuum_ent, 'resume_cleaning') and
            current_queue | length > 0
          }}
    then:
      - variables:
          skipped_rooms: >
            {% set skipped_ids = current_queue | map('int') | list %}
            {% set rooms_dict = state_attr(vacuum_ent, 'rooms') %}
            {% set ns = namespace(all_rooms=[]) %}
            {% if rooms_dict %}
              {% for map, rooms in rooms_dict.items() %}
                {% set ns.all_rooms = ns.all_rooms + rooms %}
              {% endfor %}
            {% endif %}
            {{ ns.all_rooms | selectattr('id', 'in', skipped_ids) | map(attribute='name') | list }}
      - if:
          - condition: template
            value_template: "{{ notification_script != '' and skipped_rooms | length > 0 }}"
        then:
          - action: script.turn_on
            target:
              entity_id: !input notification_script
            data:
              variables:
                message: "The vacuum has finished its run, but skipped a few rooms: {{ skipped_rooms | join(', ') }}."
      - action: input_text.set_value
        target: { entity_id: "{{ queue_text_helper }}" }
        data: { value: "[]" }
      - stop: "Cleaning cycle ended prematurely. Cleared remaining queue."

  # Notify if the queue helper contains data but parsing fails to yield valid segment IDs
  - if:
      - condition: template
        value_template: "{{ current_queue | length == 0 and states(queue_text_helper) not in ['unknown', 'unavailable', '', '[]'] }}"
    then:
      - action: persistent_notification.create
        data:
          title: "Vacuum Queue Parsing Error"
          message: "Queue empty but input was: '{{ states(queue_text_helper) }}'. Check format."

  # Stop execution if the room queue is empty
  - condition: template
    value_template: "{{ current_queue | length > 0 }}"

  # Update the queue and tracking helpers based on the active segment
  - choose:
      # Case 1: Robot is in the expected next room (highest priority)
      - conditions:
          - condition: template
            value_template: "{{ active_segment == current_queue[0] }}"
        sequence:
          # Update the currently cleaned room helper with the active segment ID
          - action: input_number.set_value
            target:
              entity_id: "{{ currently_cleaned_helper }}"
            data:
              value: "{{ active_segment }}"
          # Remove the active segment ID from the front of the queue
          - action: input_text.set_value
            target:
              entity_id: "{{ queue_text_helper }}"
            data:
              value: "[{{ current_queue[1:] | join(',') }}]"

      # Case 2: Robot is transitioning through a corridor (ignore pass-through)
      - conditions:
          - condition: template
            value_template: "{{ active_segment in parsed_corridor_rooms }}"
        sequence:
          - stop: "Robot is in a corridor room, ignoring pass-through."

      # Case 3: Robot skipped rooms and went straight to a room further down the queue
      - conditions:
          - condition: template
            value_template: "{{ active_segment in current_queue }}"
        sequence:
          # Calculate skipped rooms and notify if target script is configured
          - variables:
              skipped_rooms: >
                {% set end_index = current_queue.index(active_segment) %}
                {% set skipped_ids = current_queue[0:end_index] | map('int') | list %}
                {% set rooms_dict = state_attr(vacuum_ent, 'rooms') %}
                {% set ns = namespace(all_rooms=[]) %}
                {% if rooms_dict %}
                  {% for map, rooms in rooms_dict.items() %}
                    {% set ns.all_rooms = ns.all_rooms + rooms %}
                  {% endfor %}
                {% endif %}
                {{ ns.all_rooms | selectattr('id', 'in', skipped_ids) | map(attribute='name') | list }}
          - if:
              - condition: template
                value_template: "{{ notification_script != '' and skipped_rooms | length > 0 }}"
            then:
              - action: script.turn_on
                target:
                  entity_id: !input notification_script
                data:
                  variables:
                    message: "Just so you know, the vacuum skipped these rooms: {{ skipped_rooms | join(', ') }}."
          - action: input_number.set_value
            target:
              entity_id: "{{ currently_cleaned_helper }}"
            data:
              value: "{{ active_segment }}"
          # Fast-forward the queue, removing the current and all skipped room IDs
          - action: input_text.set_value
            target:
              entity_id: "{{ queue_text_helper }}"
            data:
              value: >
                {% set start_index = current_queue.index(active_segment) + 1 %}
                [{{ current_queue[start_index:] | join(',') }}]
