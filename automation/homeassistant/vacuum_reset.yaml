blueprint:
  name: Dreame Vacuum - Reset and Notify
  description: Resets helpers, creates a To-Do, and clears specific vacuum notifications when finished.
  domain: automation
  input:
    vacuum_entity:
      name: Vacuum Robot
      description: "The Dreame vacuum robot entity. This device must also be assigned the helper entities (queue, current segment, etc.) for dynamic discovery to work."
      selector:
        entity:
          domain: vacuum
          integration: dreame_vacuum
    task_status_sensor:
      name: Task Status Sensor
      description: "The task status sensor of the vacuum robot."
      selector:
        entity:
          domain: sensor
    todo_list:
      name: To-Do List
      description: "The To-Do list to query and add maintenance tasks to when cleaning completes."
      selector:
        entity:
          domain: todo
    todo_title:
      name: To-Do Item Title
      description: "The header/title of the maintenance task created on your To-Do list."
      default: "Robot Cleaning"
      selector:
        text:
    notification_script:
      name: Notification Script
      description: "Optional script to run when the cleaning cycle completes. Receives a 'message' variable."
      default: ""
      selector:
        entity:
          domain: script
    consumable_check_script:
      name: Consumable Check Script
      description: "Optional script to run when the cleaning cycle completes to check and report low consumables."
      default: ""
      selector:
        entity:
          domain: script

mode: single

triggers:
  # Trigger when the vacuum's task status changes to completed
  - trigger: state
    entity_id: !input task_status_sensor
    to: "completed"

condition:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none and trigger.from_state.state not in ['unavailable', 'unknown', 'idle'] }}

variables:
  vacuum_ent: !input vacuum_entity 
  consumable_script: !input consumable_check_script
  dev_id: "{{ device_id(vacuum_ent) }}"
  # Extract the MAC address from attributes to match the dismissal ID format
  mac_addr: "{{ state_attr(vacuum_ent, 'mac_address') }}"
  
  # Find helper entities associated with the device dynamically via labels or device ID.
  # This dynamic discovery reduces the number of blueprint inputs/variables the user must configure.
  dev_entities: >-
    {% set all_labels = (labels(vacuum_ent)) | unique %}
    {% set labeled_entities = all_labels | map('label_entities') | sum(start=[]) %}
    {{ (device_entities(dev_id) + labeled_entities) | unique | list }}
  
  queue_text_helper: "{{ dev_entities | select('match', '^input_text\\..*_rooms_to_clean$') | first | default('none') }}"
  currently_cleaned_helper: "{{ dev_entities | select('match', '^input_number\\..*_currently_cleaned$') | first | default('none') }}"
  cleaning_type_helper: "{{ dev_entities | select('match', '^input_select\\..*_cleaning_type$') | first | default('none') }}"
  is_vacuum_only: "{{ cleaning_type_helper != 'none' and states(cleaning_type_helper) | lower == 'vacuum' }}"

  # Compute skipped rooms dynamically from the remaining items in queue_text_helper before resetting it
  skipped_rooms: >-
    {% set val = states(queue_text_helper) if queue_text_helper != 'none' else '[]' %}
    {% set skipped_ids = [] %}
    {% if val not in ['unknown', 'unavailable', '', '[]'] %}
      {% set raw = val | replace('[', '') | replace(']', '') | replace(' ', '') %}
      {% set skipped_ids = raw.split(',') | map('int', 0) | select('gt', 0) | list %}
    {% endif %}
    {% set rooms_dict = state_attr(vacuum_ent, 'rooms') %}
    {% set ns = namespace(all_rooms=[]) %}
    {% if rooms_dict %}
      {% for map, rooms in rooms_dict.items() %}
        {% set ns.all_rooms = ns.all_rooms + rooms %}
      {% endfor %}
    {% endif %}
    {{ ns.all_rooms | selectattr('id', 'in', skipped_ids) | map(attribute='name') | list }}

action:
  # Reset the rooms to clean helper to empty the queue
  - if:
      - condition: template
        value_template: "{{ queue_text_helper != 'none' }}"
    then:
      - action: input_text.set_value
        target:
          entity_id: "{{ queue_text_helper }}"
        data:
          value: "[]"

  # Reset the currently cleaned room helper counter
  - if:
      - condition: template
        value_template: "{{ currently_cleaned_helper != 'none' }}"
    then:
      - action: input_number.set_value
        target:
          entity_id: "{{ currently_cleaned_helper }}"
        data:
          value: 0

  # Create maintenance checklist task unless the cycle was vacuum-only
  - if:
      - condition: template
        value_template: "{{ not is_vacuum_only }}"
    then:
      - action: script.todo_create_task
        data:
          heading: !input todo_title
          body: Replace water and clean the robot
          target_list: !input todo_list

  # Run the custom notification script to alert the user if configured
  - if:
      - condition: template
        value_template: "{{ notification_script != '' }}"
    then:
      - action: script.turn_on
        target:
          entity_id: !input notification_script
        data:
          variables:
            message: >-
              {% set skipped_str = "" %}
              {% if skipped_rooms | length > 0 %}
                {% set skipped_str = ", but skipped some rooms: " ~ skipped_rooms | join(', ') %}
              {% endif %}
              {% if is_vacuum_only %}
                The vacuum has finished cleaning and is back at its dock{{ skipped_str }}.
              {% else %}
                The vacuum has finished cleaning and is back at its dock{{ skipped_str }}. Whenever you have a moment, please remember to clean the robot and replace the water.
              {% endif %}

  # Run the consumable check script if configured
  - if:
      - condition: template
        value_template: "{{ consumable_script != '' }}"
    then:
      - action: script.turn_on
        target:
          entity_id: "{{ consumable_script }}"
