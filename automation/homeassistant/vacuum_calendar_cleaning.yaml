blueprint:
  name: Calendar-Based Vacuum with Task Check
  description: >
    Starts a vacuum script based on a calendar event, but only if a specific 
    maintenance task is not present on your To-Do list.
  domain: automation
  input:
    vacuum_entity:
      name: Vacuum Robot
      description: "The Dreame vacuum robot entity. This device must also be assigned the helper entities (queue, current segment, etc.) for dynamic discovery to work."
      selector:
        entity:
          domain: vacuum
          integration: dreame_vacuum
    calendar_entity:
      name: Calendar
      description: "The calendar entity to monitor for cleaning schedule events."
      selector:
        entity:
          domain: calendar
    calendar_summary_match:
      name: Event Summary Filter
      description: "Only trigger cleaning if the calendar event summary contains this search phrase (case-insensitive)."
      default: "eg auto cleaning"
      selector:
        text:
    todo_list:
      name: To-Do List
      description: "The To-Do list to check for active maintenance tasks. If a task matching the search term is found, cleaning is skipped."
      selector:
        entity:
          domain: todo
    todo_search_term:
      name: To-Do Search Term
      description: "The text to search for on the To-Do list (e.g., 'clean filter' or 'clean robot'). Case-insensitive."
      default: "clean eg robot"
      selector:
        text:
    cleaning_script:
      name: Cleaning Script
      description: "The cleaning script to run when scheduling requirements are met (typically script.robot_vacuum)."
      selector:
        entity:
          domain: script
    ignore_rooms:
      name: Ignored Rooms
      description: "List of room IDs to exclude from cleaning (e.g. [1, 5])."
      default: []
      selector:
        object:
    cleaning_mode_select:
      name: Cleaning Mode Selector
      description: "The input select entity used to control the vacuum's cleaning mode (e.g., input_select.cleaning_type_selector)."
      default: input_select.eg_cleaning_type
      selector:
        entity:
          domain: input_select
    cleaning_mode_option:
      name: Cleaning Mode
      description: "The cleaning mode to set on the selector (e.g., Vacuum and Mop)."
      default: "Vacuum and Mop"
      selector:
        select:
          options:
            - "Vacuum"
            - "Mop"
            - "Vacuum and Mop"
            - "Deep Clean"

variables:
  vacuum_ent: !input vacuum_entity
  dev_id: "{{ device_id(vacuum_ent) }}"
  # Find all entities belonging to the same device OR sharing any label with the vacuum entity.
  # This dynamic discovery reduces the number of blueprint inputs/variables the user must configure.
  dev_entities: >-
    {% set all_labels = (labels(vacuum_ent)) | unique %}
    {% set labeled_entities = all_labels | map('label_entities') | sum(start=[]) %}
    {{ (device_entities(dev_id) + labeled_entities) | unique | list }}
  queue_text_helper: "{{ dev_entities | select('match', '^input_text\\..*_rooms_to_clean$') | first | default('none') }}"
  ignored_rooms: !input ignore_rooms
  cleaning_sequence: "{{ state_attr(vacuum_ent, 'cleaning_sequence') | default([], true) | reject('in', ignored_rooms) | list }}"
  summary_filter: !input calendar_summary_match

triggers:
  - event: start
    offset: "0:0:0"
    entity_id: !input calendar_entity
    trigger: calendar

condition:
  # Only continue if the calendar event title contains our search term (case-insensitive)
  - condition: template
    value_template: "{{ (summary_filter | trim | lower) in (trigger.calendar_event.summary | lower) }}"

action:
  # Calls a helper script to check if a specific task exists on the To-Do list
  # The script must return a response_variable (available in HA 2023.7+)
  - action: script.todo_check_task
    data:
      search_term: !input todo_search_term
      target_list: !input todo_list
    response_variable: robot_task_check

  # Only proceed if the maintenance task was not found
  - if:
      - condition: template
        value_template: "{{ not robot_task_check.exists }}"
    then:
      # Populate the rooms_to_clean helper with the vacuum's cleaning sequence
      - if:
          - condition: template
            value_template: "{{ queue_text_helper != 'none' and cleaning_sequence is not none }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: "{{ queue_text_helper }}"
            data:
              value: "{{ cleaning_sequence | to_json }}"
      - action: input_select.select_option
        target:
          entity_id: !input cleaning_mode_select
        data:
          option: !input cleaning_mode_option

      # Run the user-defined cleaning script
      - action: !input cleaning_script

mode: single
